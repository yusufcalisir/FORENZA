# ==============================================================================
# FORENZA: Forensic Evidence Operating System
# Air-Gapped Standalone Production Docker Compose Specification
# ==============================================================================

name: forenza-airgap

services:
  # ----------------------------------------------------------------------------
  # 1. GATEWAY: Nginx Reverse Proxy with TLS 1.3 & WebSocket Streaming
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: forenza-airgap-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - forenza-net

  # ----------------------------------------------------------------------------
  # 2. BACKEND: FastAPI Multi-Omic Biocomputational Microservices Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: forenza-backend:latest
    container_name: forenza-airgap-backend
    restart: unless-stopped
    env_file:
      - .env.airgap
    environment:
      - AIRGAP_MODE=true
      - OFFLINE_SIMULATION=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-forenza}:${POSTGRES_PASSWORD:-forenza_airgap_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-forenza_lims}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - forenza-net

  # ----------------------------------------------------------------------------
  # 3. FRONTEND: Next.js 16 Standalone Tactical Forensic Workstation UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: forenza-frontend:latest
    container_name: forenza-airgap-frontend
    restart: unless-stopped
    env_file:
      - .env.airgap
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://localhost:${GATEWAY_HTTPS_PORT:-8443}
      - NEXT_PUBLIC_AIRGAP_MODE=true
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - forenza-net

  # ----------------------------------------------------------------------------
  # 4. DATABASE: PostgreSQL 16 Enterprise LIMS & Custody Ledger Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: forenza-airgap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forenza_airgap_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-forenza_lims}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forenza}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forenza-net

  # ----------------------------------------------------------------------------
  # 5. CACHE & QUEUE: Redis 7 In-Memory Asynchronous Job Worker Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forenza-airgap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forenza-net

# ------------------------------------------------------------------------------
# Persistent Volume Definitions (Retained Across Restarts & Power Cycles)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: forenza_airgap_postgres_data
  redis_data:
    name: forenza_airgap_redis_data
  backend_data:
    name: forenza_airgap_backend_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  forenza-net:
    name: forenza_airgap_network
    driver: bridge

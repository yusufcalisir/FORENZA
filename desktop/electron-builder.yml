# ==============================================================================
# FORENZA: Forensic Evidence Operating System
# Electron Builder Production Distribution Specification
# ==============================================================================

appId: dev.yusufcalisir.forenza
productName: FORENZA
copyright: Copyright © 2026 FORENZA Forensic Biocomputational Intelligence

directories:
  output: ../dist/desktop
  buildResources: assets

files:
  - "**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"

extraResources:
  - from: "../backend"
    to: "backend"
    filter:
      - "**/*"
      - "!**/.pytest_cache"
      - "!**/__pycache__"
  - from: "../research"
    to: "research"

# --- Windows Configuration ---
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FORENZA Forensic Workstation
  uninstallDisplayName: FORENZA Forensic Evidence OS

# --- Linux Configuration ---
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Science;Education;
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"

# --- macOS Configuration ---
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  artifactName: "${productName}-${version}-${arch}.${ext}"
